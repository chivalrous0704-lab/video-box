<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#0b0b0d" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="動画BOX" />
<link rel="manifest" href="/manifest.webmanifest" />
<title>動画BOX</title>
<style>
:root{--bg:#0b0b0d;--card:#17171b;--card2:#202026;--muted:#9b9ba5;--line:#2b2b33;--txt:#f7f7f8;--ok:#9ce8b0;--bad:#ffabab}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
.wrap{max-width:760px;margin:auto;padding:18px 16px calc(110px + env(safe-area-inset-bottom))}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
h1{font-size:27px;margin:0;letter-spacing:-.02em}.badge{font-size:12px;padding:7px 10px;background:#24242a;border:1px solid var(--line);border-radius:999px;color:#ddd}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin:12px 0;box-shadow:0 12px 30px #0004}
label{font-size:13px;color:var(--muted);display:block;margin-bottom:8px}.field{position:relative}.field input{padding-right:74px}input{width:100%;border:1px solid var(--line);background:#0f0f12;color:#fff;border-radius:15px;padding:15px;font-size:16px;outline:none}input:focus{border-color:#555}
button,.btn{border:0;border-radius:14px;padding:13px 15px;font-weight:700;font-size:15px;cursor:pointer;text-decoration:none;text-align:center}.primary{background:#fff;color:#111}.ghost{background:#24242a;color:#fff;border:1px solid var(--line)}.soft{background:#1e1e23;color:#ddd;border:1px solid var(--line)}.danger{background:#2a1718;color:#ffb7ba;border:1px solid #5b2a2d}.mini{padding:8px 10px;font-size:12px;border-radius:10px}
.row{display:flex;gap:10px;margin-top:12px}.row>*{flex:1}.status{font-size:13px;color:var(--muted);line-height:1.55;margin-top:10px}.error{color:var(--bad)}.ok{color:var(--ok)}
video,audio{width:100%;margin-top:14px;border-radius:15px;background:#000}.section-title{display:flex;align-items:center;justify-content:space-between;margin-top:24px}.section-title h2{font-size:20px;margin:0}.count{font-size:12px;color:var(--muted)}
.item{padding:15px 0;border-top:1px solid var(--line)}.item:first-child{border-top:0}.thumb{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:14px;background:#0d0d0f;margin-bottom:12px}.name{font-weight:750;overflow-wrap:anywhere}.meta{font-size:12px;color:var(--muted);margin:5px 0 10px}.smallrow{display:flex;gap:8px;flex-wrap:wrap}.smallrow>*{flex:1;min-width:88px}.smallrow button,.smallrow a{padding:10px 12px;font-size:13px}
.empty{padding:26px 8px;text-align:center;color:var(--muted);font-size:14px}.notice{font-size:12px;color:var(--muted);line-height:1.65;margin-top:12px}.footer{margin-top:28px;text-align:center;color:#686872;font-size:11px}.hidden{display:none!important}.filenamebox{margin-top:12px}.toolbar{display:flex;gap:8px;margin-top:8px}.toolbar button{flex:1}.paste{position:absolute;right:8px;top:8px;padding:8px 10px;font-size:12px;border-radius:10px}.install{margin-top:10px}.installGuide{margin-top:10px;padding:12px;border-radius:14px;background:#101014;border:1px solid var(--line);font-size:13px;line-height:1.6;color:#d8d8dd}.historyHead{display:flex;gap:8px;align-items:center}.historyHead button{white-space:nowrap}
</style>
</head>
<body><div class="wrap">
  <div class="top"><h1>動画BOX</h1><span class="badge">v0.4</span></div>

  <div class="card">
    <label for="url">動画・音声ファイルの直接URL</label>
    <div class="field">
      <input id="url" inputmode="url" placeholder="https://example.com/video.mp4" autocomplete="off" />
      <button id="paste" class="soft paste" type="button">貼り付け</button>
    </div>
    <div class="row"><button id="check" class="ghost">確認</button><button id="clear" class="soft">クリア</button></div>
    <div id="status" class="status">URLを貼って「確認」を押してください。</div>
    <video id="preview" class="hidden" controls playsinline></video>

    <div id="filenamebox" class="filenamebox hidden">
      <label for="filename">保存ファイル名</label>
      <input id="filename" autocomplete="off" />
      <div class="row"><button id="download" class="primary">端末に保存</button></div>
    </div>

    <button id="install" class="ghost install" type="button">ホーム画面に追加</button>
    <div id="installGuide" class="installGuide hidden"></div>
    <div class="notice">※ 自分が権利を持つ動画、または保存が許可された動画で利用してください。Instagram・TikTok・X・YouTubeなどの投稿ページからの抽出は行いません。</div>
  </div>

  <div class="section-title">
    <div class="historyHead"><h2>保存履歴</h2><span id="count" class="count"></span></div>
    <button id="clearHistory" class="danger mini" type="button">履歴を全削除</button>
  </div>
  <div id="history" class="card"></div>
  <div class="footer">動画BOX — direct media downloader</div>
</div>
<script>
const $=s=>document.querySelector(s);
const url=$('#url'), status=$('#status'), preview=$('#preview'), dl=$('#download'), filename=$('#filename'), filenamebox=$('#filenamebox');
let current=null, deferredInstall=null;
const KEY='videobox-history-v04';
const OLD_KEYS=['videobox-history-v02','videobox-history-v03'];

function migrate(){
  if(localStorage.getItem(KEY)) return;
  for(const k of OLD_KEYS){
    const v=localStorage.getItem(k); if(v){localStorage.setItem(KEY,v);break;}
  }
}
function histories(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return []}}
function saveHist(arr){localStorage.setItem(KEY,JSON.stringify(arr.slice(0,60)));render()}
function fmtBytes(n){if(!n)return 'サイズ不明'; const u=['B','KB','MB','GB']; let i=0;while(n>=1024&&i<u.length-1){n/=1024;i++}return `${n.toFixed(i?1:0)} ${u[i]}`}
function setStatus(t,cls=''){status.className='status '+cls;status.textContent=t}
function cleanName(s){return String(s||'video').trim().replace(/[\\/:*?"<>|]/g,'_').slice(0,120)||'video'}
function resetInspect(){current=null;preview.pause();preview.classList.add('hidden');preview.removeAttribute('src');filenamebox.classList.add('hidden');filename.value='';}

async function inspect(){
  const v=url.value.trim(); resetInspect();
  if(!v)return setStatus('URLを入力してください。','error');
  setStatus('確認しています…');
  try{
    const r=await fetch('/api/inspect?url='+encodeURIComponent(v)); const j=await r.json(); if(!r.ok)throw new Error(j.error||'確認できませんでした');
    current=j; preview.src=j.finalUrl; preview.classList.remove('hidden'); filename.value=j.filename||'video.mp4'; filenamebox.classList.remove('hidden');
    setStatus(`確認OK：${j.filename} / ${fmtBytes(j.bytes)} / ${j.contentType||'種類不明'}`,'ok');
  }catch(e){setStatus(e.message,'error')}
}
function download(){
  if(!current)return;
  const name=cleanName(filename.value||current.filename);
  const href='/api/download?url='+encodeURIComponent(current.finalUrl)+'&name='+encodeURIComponent(name);
  const a=document.createElement('a');a.href=href;a.download=name;document.body.appendChild(a);a.click();a.remove();
  const arr=histories(); arr.unshift({id:Date.now(),name,url:current.finalUrl,type:current.contentType,bytes:current.bytes,at:new Date().toISOString()}); saveHist(arr);
  setStatus('保存を開始しました。Safariのダウンロード表示を確認してください。','ok');
}
function render(){
  const arr=histories(); $('#count').textContent=`${arr.length}件`; const root=$('#history'); $('#clearHistory').disabled=!arr.length;
  if(!arr.length){root.innerHTML='<div class="empty">まだ履歴はありません。</div>';return}
  root.innerHTML=arr.map(x=>`<div class="item">
    <video class="thumb" src="${escAttr(x.url)}" muted playsinline preload="metadata"></video>
    <div class="name">${esc(x.name||'video')}</div>
    <div class="meta">${fmtBytes(x.bytes)} ・ ${new Date(x.at).toLocaleString('ja-JP')}</div>
    <div class="smallrow">
      <button class="ghost" data-play="${x.id}">再生</button>
      <a class="btn primary" href="/api/download?url=${encodeURIComponent(x.url)}&name=${encodeURIComponent(x.name||'video')}">再保存</a>
      <button class="soft" data-rename="${x.id}">名前変更</button>
      <button class="danger" data-del="${x.id}">削除</button>
    </div>
    <div id="p${x.id}"></div>
  </div>`).join('');
}
function esc(s){return String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function escAttr(s){return esc(s).replace(/'/g,'&#39;')}

document.addEventListener('click',e=>{
  const pid=e.target.dataset.play, did=e.target.dataset.del, rid=e.target.dataset.rename;
  if(pid){const x=histories().find(v=>String(v.id)===pid);const box=$('#p'+pid);if(x)box.innerHTML=`<video controls playsinline src="${escAttr(x.url)}"></video>`}
  if(did){saveHist(histories().filter(v=>String(v.id)!==did))}
  if(rid){const arr=histories();const x=arr.find(v=>String(v.id)===rid);if(!x)return;const next=prompt('新しいファイル名',x.name||'video');if(next!==null){x.name=cleanName(next);saveHist(arr)}}
});

$('#check').onclick=inspect; dl.onclick=download;
$('#clear').onclick=()=>{url.value='';resetInspect();setStatus('URLを貼って「確認」を押してください。');url.focus()};
$('#paste').onclick=async()=>{try{const t=await navigator.clipboard.readText();if(t){url.value=t;setStatus('クリップボードから貼り付けました。')}}catch{setStatus('貼り付けできませんでした。入力欄を長押しして貼り付けてください。','error')}};
$('#clearHistory').onclick=()=>{if(histories().length&&confirm('保存履歴をすべて削除しますか？'))saveHist([])};
url.addEventListener('keydown',e=>{if(e.key==='Enter')inspect()});

window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;});
$('#install').onclick=async()=>{
  const guide=$('#installGuide');
  if(deferredInstall){deferredInstall.prompt();await deferredInstall.userChoice;deferredInstall=null;return;}
  const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
  guide.classList.remove('hidden');
  guide.innerHTML=isIOS?'iPhoneではSafari下部の「共有」ボタン → <b>ホーム画面に追加</b> → <b>追加</b> の順で登録できます。':'ブラウザのメニューから「ホーム画面に追加」または「アプリをインストール」を選んでください。';
};

if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{});
migrate();render();
</script></body></html>
