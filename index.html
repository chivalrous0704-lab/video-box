<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.webmanifest">
<title>動画BOX</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f8fafc;background:#020617}
body{margin:0;background:linear-gradient(180deg,#0f172a,#020617);min-height:100vh}
.wrap{max-width:760px;margin:auto;padding:20px}
.card{background:#111827;border:1px solid #273449;border-radius:18px;padding:16px;margin-bottom:16px;box-shadow:0 12px 30px rgba(0,0,0,.24)}
h1{margin:0 0 4px;font-size:28px}.muted{color:#94a3b8;font-size:14px}
input,button{font:inherit}.row{display:flex;gap:8px;flex-wrap:wrap}
input{flex:1;min-width:0;padding:14px;border-radius:12px;border:1px solid #334155;background:#0f172a;color:#fff}
button{border:0;border-radius:12px;padding:12px 14px;font-weight:700}
.primary{background:#38bdf8;color:#082f49}.secondary{background:#1e293b;color:#e2e8f0}.danger{background:#7f1d1d;color:#fee2e2}
video{width:100%;border-radius:14px;background:#000;margin-top:12px;max-height:430px}
.embed{width:100%;height:680px;border:0;border-radius:14px;background:#fff;margin-top:12px}
.tiktok{aspect-ratio:9/16;height:auto;max-height:680px;background:#000}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#1e293b;color:#cbd5e1;font-size:12px}
.ok{background:#064e3b;color:#d1fae5}.warn{background:#78350f;color:#fef3c7}.err{background:#7f1d1d;color:#fee2e2}
.top{display:flex;justify-content:space-between;align-items:center}.hidden{display:none}
.platform{margin-top:10px}.note{font-size:13px;line-height:1.5;color:#cbd5e1}
.meta{display:grid;grid-template-columns:100px 1fr;gap:12px;margin-top:14px;align-items:start}
.meta img{width:100px;border-radius:12px;background:#0f172a}
.meta strong{display:block;margin-bottom:6px}
.item{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center;border-top:1px solid #243244;padding:12px 0}
.thumb{width:96px;height:70px;object-fit:cover;border-radius:10px;background:#0f172a}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.small{padding:8px 10px;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1>動画BOX</h1><div class="muted">動画URLを確認・保存・整理</div></div>
    <span class="badge">v0.8</span>
  </div>

  <div class="card">
    <div class="row">
      <input id="url" placeholder="動画URL / TikTok / Instagram / X の投稿URL">
      <button class="secondary" id="paste">貼り付け</button>
      <button class="secondary" id="clear">クリア</button>
      <button class="primary" id="check">確認</button>
    </div>

    <div id="platform" class="platform hidden"></div>
    <div id="status" class="muted" style="margin-top:10px"></div>

    <div id="directBox" class="hidden">
      <video id="preview" controls playsinline></video>
      <div class="row" style="margin-top:10px">
        <input id="filename" placeholder="保存ファイル名">
        <button class="primary" id="save">端末に保存</button>
      </div>
    </div>

    <div id="tiktokBox" class="hidden">
      <div class="meta">
        <img id="ttThumb" alt="">
        <div><strong id="ttTitle"></strong><div class="muted" id="ttAuthor"></div></div>
      </div>
      <iframe id="ttPlayer" class="embed tiktok" allow="autoplay; encrypted-media" allowfullscreen></iframe>
      <div class="actions"><button class="secondary" id="openTikTok">元の投稿を開く</button></div>
    </div>

    <div id="embedBox" class="hidden">
      <iframe id="socialEmbed" class="embed" sandbox="allow-scripts allow-same-origin allow-popups allow-forms"></iframe>
      <div class="actions"><button class="secondary" id="openSocial">元の投稿を開く</button></div>
    </div>
  </div>

  <div class="card">
    <div class="top">
      <strong>保存履歴</strong>
      <button class="danger small" id="clearHistory">全削除</button>
    </div>
    <div id="history" class="muted" style="margin-top:8px">まだありません</div>
  </div>
</div>

<script>
const $=s=>document.querySelector(s);
const urlEl=$("#url"),statusEl=$("#status"),platformEl=$("#platform"),directBox=$("#directBox"),
tiktokBox=$("#tiktokBox"),embedBox=$("#embedBox"),preview=$("#preview"),filename=$("#filename"),historyEl=$("#history");

function classify(raw){
  let u; try{u=new URL(raw)}catch{return {type:"invalid"}}
  const h=u.hostname.replace(/^www\./,"").toLowerCase();
  if(h==="tiktok.com"||h.endsWith(".tiktok.com")||h==="vt.tiktok.com"||h==="vm.tiktok.com") return {type:"tiktok"};
  if(h==="instagram.com"||h.endsWith(".instagram.com")) return {type:"instagram"};
  if(h==="x.com"||h.endsWith(".x.com")||h==="twitter.com"||h.endsWith(".twitter.com")) return {type:"x"};
  if(/\.(mp4|webm|mov|m4v)$/.test(u.pathname.toLowerCase())) return {type:"direct"};
  return {type:"unknown"};
}
function setBadge(t,c=""){platformEl.className="platform";platformEl.innerHTML=`<span class="badge ${c}">${t}</span>`}
function resetBoxes(){
  [directBox,tiktokBox,embedBox].forEach(x=>x.classList.add("hidden"));
  platformEl.classList.add("hidden"); statusEl.textContent="";
  preview.removeAttribute("src"); preview.load(); $("#ttPlayer").src=""; $("#socialEmbed").srcdoc="";
}
function wrapEmbed(html,provider){
  const extra = provider==="Instagram"
    ? '<script async src="https://www.instagram.com/embed.js"></'+'script>'
    : '<script async src="https://platform.twitter.com/widgets.js" charset="utf-8"></'+'script>';
  return `<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1">
  <style>body{margin:0;padding:8px;background:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}blockquote{margin:auto!important}</style>
  </head><body>${html}${extra}</body></html>`;
}
async function checkUrl(){
  resetBoxes(); const raw=urlEl.value.trim(); if(!raw){statusEl.textContent="URLを入力してね";return}
  const c=classify(raw);
  if(c.type==="invalid"){setBadge("URL形式エラー","err");statusEl.textContent="URLを確認してね";return}

  if(c.type==="tiktok"){
    setBadge("TikTok 投稿URL","ok"); statusEl.textContent="TikTok投稿を取得しています…";
    try{
      const r=await fetch("/api/tiktok-oembed?url="+encodeURIComponent(raw)); const d=await r.json();
      if(!r.ok||!d.ok) throw new Error(d.error||"取得できませんでした");
      tiktokBox.classList.remove("hidden"); $("#ttTitle").textContent=d.title||"TikTok動画";
      $("#ttAuthor").textContent=d.author_name?("@"+d.author_name.replace(/^@/,"")):"";
      $("#ttThumb").src=d.thumbnail_url||""; $("#ttPlayer").src=d.player_url;
      $("#openTikTok").onclick=()=>window.open(raw,"_blank"); statusEl.textContent="TikTok投稿を表示しました。";
    }catch(e){statusEl.textContent="TikTok取得エラー: "+e.message}
    return;
  }

  if(c.type==="instagram"||c.type==="x"){
    const label=c.type==="instagram"?"Instagram 投稿URL":"X 投稿URL";
    setBadge(label,"ok"); statusEl.textContent=label.replace(" URL","")+"を取得しています…";
    try{
      const endpoint=c.type==="instagram"?"/api/instagram-oembed":"/api/x-oembed";
      const r=await fetch(endpoint+"?url="+encodeURIComponent(raw)); const d=await r.json();
      if(!r.ok||!d.ok) throw new Error(d.error||"取得できませんでした");
      embedBox.classList.remove("hidden");
      $("#socialEmbed").srcdoc=wrapEmbed(d.html,d.provider);
      $("#openSocial").onclick=()=>window.open(raw,"_blank");
      statusEl.textContent=d.provider+"投稿を表示しました。";
    }catch(e){statusEl.textContent="取得エラー: "+e.message}
    return;
  }

  setBadge(c.type==="direct"?"直接動画URL":"通常URL",c.type==="direct"?"ok":"warn");
  statusEl.textContent="動画URLを確認しています…";
  try{
    const r=await fetch("/api/check?url="+encodeURIComponent(raw)); const d=await r.json();
    if(!r.ok||!d.ok) throw new Error(d.error||"確認できませんでした");
    if(!d.isVideo){statusEl.textContent="直接動画ファイルとして確認できませんでした。";return}
    directBox.classList.remove("hidden"); preview.src=d.proxyUrl; filename.value=d.filename||"video.mp4"; statusEl.textContent="動画を確認できました。";
  }catch(e){statusEl.textContent="確認エラー: "+e.message}
}
async function saveCurrent(){
  const raw=urlEl.value.trim(); const name=(filename.value.trim()||"video.mp4").replace(/[\\/:*?"<>|]+/g,"_");
  try{
    statusEl.textContent="保存準備中…"; const r=await fetch("/api/download?url="+encodeURIComponent(raw)); if(!r.ok) throw new Error("取得できませんでした");
    const blob=await r.blob(); const file=new File([blob],name,{type:blob.type||"video/mp4"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name})}
    else{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}
    addHistory({name,url:raw,date:new Date().toLocaleString("ja-JP")}); statusEl.textContent="保存操作を開きました。";
  }catch(e){statusEl.textContent="保存エラー: "+e.message}
}
function getHistory(){try{return JSON.parse(localStorage.getItem("videoBoxHistory")||"[]")}catch{return []}}
function setHistory(v){localStorage.setItem("videoBoxHistory",JSON.stringify(v));renderHistory()}
function addHistory(item){const h=getHistory();h.unshift(item);setHistory(h.slice(0,50))}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function renderHistory(){
  const h=getHistory(); if(!h.length){historyEl.innerHTML="まだありません";return}
  historyEl.innerHTML=h.map((x,i)=>`<div class="item"><video class="thumb" src="/api/stream?url=${encodeURIComponent(x.url)}" muted preload="metadata"></video><div><strong>${esc(x.name)}</strong><div class="muted">${esc(x.date||"")}</div><div class="actions"><button class="secondary small" onclick="reopen(${i})">再生</button><button class="secondary small" onclick="renameItem(${i})">名前変更</button><button class="danger small" onclick="removeItem(${i})">削除</button></div></div></div>`).join("")
}
window.reopen=i=>{const x=getHistory()[i];urlEl.value=x.url;checkUrl();window.scrollTo({top:0,behavior:"smooth"})}
window.renameItem=i=>{const h=getHistory();const n=prompt("新しい名前",h[i].name);if(n){h[i].name=n;setHistory(h)}}
window.removeItem=i=>{const h=getHistory();h.splice(i,1);setHistory(h)}
$("#check").onclick=checkUrl; $("#save").onclick=saveCurrent; $("#clear").onclick=()=>{urlEl.value="";resetBoxes()};
$("#paste").onclick=async()=>{try{urlEl.value=await navigator.clipboard.readText()}catch{statusEl.textContent="貼り付けできませんでした"}};
$("#clearHistory").onclick=()=>{if(confirm("保存履歴をすべて削除しますか？"))setHistory([])};
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js"); renderHistory();
</script>
</body></html>
